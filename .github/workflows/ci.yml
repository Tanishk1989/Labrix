name: TRACE CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labrix
          POSTGRES_PASSWORD: labrix-ci-password
          POSTGRES_DB: labrix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://labrix:labrix-ci-password@localhost:5432/labrix_ci?schema=public"
      LABRIX_TEST_DATABASE_URL: "postgresql://labrix:labrix-ci-password@localhost:5432/labrix_test?schema=public"
      LABRIX_ALLOW_TEST_DATABASE_MUTATION: "true"
      LABRIX_IDENTITY_MODE: "clerk"
      LABRIX_EXECUTION_PROVIDER: "remote-docker"
      LABRIX_JAVA_RUNNER_URL: "https://java-runner.example.test/v1/execute/java"
      LABRIX_CPP_RUNNER_URL: "https://cpp-runner.example.test/v1/execute/cpp"
      LABRIX_RUNNER_BEARER_TOKEN: "ci-only-runner-token-at-least-32-characters"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder_key_for_ci_build"
      CLERK_SECRET_KEY: "sk_test_placeholder_secret_for_ci_build"
      CLERK_WEBHOOK_SECRET: "whsec_dGVzdC1vbmx5LWNpLXdlYmhvb2stc2VjcmV0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Run Unit & Accessibility Tests
        run: npm run test:unit

      - name: Create Disposable Test Database
        env:
          PGPASSWORD: labrix-ci-password
        run: psql --host localhost --username labrix --dbname labrix_ci --command "CREATE DATABASE labrix_test"

      - name: Prepare Test Database
        run: npm run test:db:prepare

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Browser Acceptance Tests
        run: npm run test:e2e

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Next.js Production Build
        env:
          UPSTASH_REDIS_REST_URL: "https://ci-placeholder.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "ci-placeholder-token"
        run: npm run build


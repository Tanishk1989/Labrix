services:
  postgres:
    image: postgres:16-alpine
    container_name: trace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}
      POSTGRES_DB: ${POSTGRES_DB:-trace_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trace_user} -d ${POSTGRES_DB:-trace_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trace-network

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: trace-migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trace_user}:${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}@postgres:5432/${POSTGRES_DB:-trace_db}?schema=public
    networks:
      - trace-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trace-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LABRIX_IDENTITY_MODE: clerk
      DATABASE_URL: postgresql://${POSTGRES_USER:-trace_user}:${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}@postgres:5432/${POSTGRES_DB:-trace_db}?schema=public
      PORT: 3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set the Clerk publishable key}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set the Clerk secret key}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:?Set the Clerk webhook secret}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?Set the Upstash REST URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?Set the Upstash REST token}
      LABRIX_EXECUTION_PROVIDER: remote-docker
      LABRIX_EXECUTION_DISPATCH: queued
      LABRIX_JAVA_RUNNER_URL: ${LABRIX_JAVA_RUNNER_URL:?Set the HTTPS Java runner endpoint}
      LABRIX_CPP_RUNNER_URL: ${LABRIX_CPP_RUNNER_URL:?Set the HTTPS C++ runner endpoint}
      LABRIX_RUNNER_BEARER_TOKEN: ${LABRIX_RUNNER_BEARER_TOKEN:?Set a random runner bearer token of at least 32 characters}
      RUNNER_MAX_CONCURRENCY: ${RUNNER_MAX_CONCURRENCY:-4}
      RUNNER_MAX_QUEUE_SIZE: ${RUNNER_MAX_QUEUE_SIZE:-64}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trace-network

networks:
  trace-network:
    driver: bridge

volumes:
  postgres_data:

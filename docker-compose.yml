version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: labrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labrix_user
      POSTGRES_PASSWORD: labrix_secure_password
      POSTGRES_DB: labrix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labrix_user -d labrix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labrix-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://labrix_user:labrix_secure_password@postgres:5432/labrix_db?schema=public
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
